name: Game Off 2026 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Headless Verification Tests
        run: npm test
      - name: Verify itch.io Packaging Pipeline
        run: npm run package
