<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Pulse Resonance - GitHub Game Off 2026 Championship Entry">
  <title>Pulse Resonance | GitHub Game Off 2026</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03060c;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh; /* 16:9 ratio */
      max-height: 56.25vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }

    #footer-bar {
      position: absolute;
      bottom: 8px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    #footer-bar a {
      color: #00f0ff;
      text-decoration: none;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <main id="game-container">
    <canvas id="game-canvas" width="1280" height="720" tabindex="0"></canvas>
    <div id="footer-bar">
      GitHub Game Off 2026 • Built with Zero External Dependencies • <a href="https://github.com/vyva360-byte" target="_blank" rel="noopener">GitHub Source</a>
    </div>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
